# ═══════════════════════════════════════════════════════════════════════
#  HEXGLASS — hyprlock
# ═══════════════════════════════════════════════════════════════════════
#  Ported from the Sci-Fi Hexagon welcome screen (HTML/SVG reference):
#    · radial gradient, circle at 50% 100%: ac81ff → 5d458f → 1a1435 → 0a0715
#    · drifting star field
#    · centered stack: GREETING (Anurati) / DAY / DATE / TIME (Snasm Light)
#  Where gradients are not possible, solid palette colours are used.
#
#  Background asset: ~/.config/hypr/hexglass/hex-bg.png
#  (regenerate with: python3 ~/.config/hypr/hexglass/make_bg.py)
#
#  Backup of the previous config: hyprlock.conf.bak.hexglass
# ═══════════════════════════════════════════════════════════════════════

$Scripts = $HOME/.config/hypr/scripts
$HexGlass = $HOME/.config/hypr/hexglass

# Palette (matches the gradient / wallust colours)
$hex-accent = rgba(ac81ff)     # top of the gradient
$hex-mid    = rgba(5d458f)     # upper-mid
$hex-deep   = rgba(1a1435)     # lower-mid
$hex-black  = rgba(0a0715)     # base
$hex-fg     = rgba(e4c9d6)     # rose-tinted white (wallust foreground)
$hex-dim    = rgba(927684)     # muted rose-grey (wallust color8)
$hex-faint  = rgba(92768499)   # 60% of the muted tone

general {
    grace = 1
    fractional_scaling = 2
    immediate_render = true
}

# ── BACKGROUND: pre-rendered gradient + stars ──────────────────────────
background {
    monitor =
    path = $HexGlass/hex-bg.png
    color = rgba(0a0715)   # rendered until the PNG is available

    blur_size = 4
    blur_passes = 0        # crisp — the art IS the gradient
    noise = 0.0117
    contrast = 1.0
    brightness = 1.0
    vibrancy = 0.21
    vibrancy_darkness = 0.0
}

# ── GREETING — Anurati, like .greeting-display ─────────────────────────
label {
    monitor =
    text = cmd[update:18000000] echo "WELCOME BACK, HEXAGON"
    color = $hex-fg
    font_size = 55
    font_family = Anurati
    text_align = center

    position = 0, 120
    halign = center
    valign = center
}

# ── DAY — Snasm, .day-display ──────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A' | tr '[:lower:]' '[:upper:]')"
    color = $hex-fg
    font_size = 24
    font_family = Snasm Light
    text_align = center

    position = 0, 20
    halign = center
    valign = center
}

# ── DATE — .date-display (muted) ───────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%d %b %Y' | tr '[:lower:]' '[:upper:]')"
    color = $hex-dim
    font_size = 20
    font_family = Snasm Light
    text_align = center

    position = 0, -35
    halign = center
    valign = center
}

# ── TIME — .time-display format: - HH:MM AM - ─────────────────────────
label {
    monitor =
    text = cmd[update:1000] echo "- $(date +'%I:%M %p') -"
    color = $hex-dim
    font_size = 16
    font_family = Snasm Light
    text_align = center

    position = 0, -90
    halign = center
    valign = center
}

# ── USER + PASSWORD PROMPT — replaces the HTML's fixed greeting row ───
label {
    monitor =
    text = cmd[update:18000000] echo "$USER"
    color = $hex-accent
    font_size = 26
    font_family = Anurati
    text_align = center

    position = 0, 310
    halign = center
    valign = bottom
}

# ── INPUT FIELD — glass pill ───────────────────────────────────────────
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = $hex-mid
    inner_color = rgba(0a0715aa)
    fail_color = rgba(b3648b)
    check_color = $hex-accent
    capslock_color = rgba(e4c9d6)

    font_color = $hex-fg
    font_family = Snasm Light
    fade_on_empty = false
    placeholder_text = <i><span foreground="##927684">type password</span></i>
    hide_input = false
    rounding = -1

    position = 0, 230
    halign = center
    valign = bottom
}

# ── CAPS LOCK HINT ─────────────────────────────────────────────────────
label {
    monitor =
    text = ⚠ CAPS LOCK
    color = $hex-faint
    font_size = 13
    font_family = Snasm Light
    text_align = center

    position = 0, 155
    halign = center
    valign = bottom
}

# ── BATTERY — bottom-right utility row ────────────────────────────────
label {
    monitor =
    text = cmd[update:3000] echo "$($Scripts/Battery.sh)"
    color = $hex-dim
    font_size = 14
    font_family = Snasm Light

    position = -40, 40
    halign = right
    valign = bottom
}

# ── UPTIME — bottom-left utility row ──────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] echo "$(uptime -p | sed 's/up //')"
    color = $hex-dim
    font_size = 14
    font_family = Snasm Light

    position = 40, 40
    halign = left
    valign = bottom
}
