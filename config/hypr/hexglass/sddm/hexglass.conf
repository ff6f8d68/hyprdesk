# ═══════════════════════════════════════════════════════════════════════
#  HEXGLASS — sddm drop-in  (installed to /etc/sddm.conf.d/hexglass.conf)
# ═══════════════════════════════════════════════════════════════════════

[Theme]
Current=hexglass
# Leave the cursor to the system default; set e.g. CursorTheme=Bibata-Modern-Ice
# here if you want the greeter cursor to match Hyprland.

[General]
# No on-screen keyboard popping over the design
InputMethod=
# Keep NumLock as the firmware left it
Numlock=none

[Users]
# Only real users in the switcher (hides system accounts)
MinimumUid=1000
MaximumUid=60000
HideShells=/usr/sbin/nologin,/bin/false

[X11]
# Greeter runs on X11 (SDDM 0.20 default). Clean DPI so the QML px scale
# matches the HTML reference on a 1080p panel.
ServerArguments=-nolisten tcp -dpi 96
