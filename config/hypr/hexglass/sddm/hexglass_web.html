<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sci-Fi Hexagon Welcome</title>

    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>

    <style>

        /* =========================================================
           FONTS
        ========================================================= */

        @font-face {
            font-family: "Anurati";
            src:
                local("Anurati"),
                url("fonts/Anurati_Regular.otf") format("opentype"),
                url("hexglass/fonts/Anurati_Regular.otf") format("opentype"),
                url("file:///usr/share/sddm/themes/hexglass/fonts/Anurati_Regular.otf") format("opentype"),
                url("file://@HYPRDESK_HOME@/.config/hypr/hexglass/sddm/hexglass/fonts/Anurati_Regular.otf") format("opentype"),
                url("file:///usr/local/share/fonts/hexglass/Anurati_Regular.otf") format("opentype");
            font-style: normal;
            font-weight: 400;
            font-display: block;
        }

        @font-face {
            font-family: "SNASM Light";
            src:
                local("SNASM Light"),
                local("Snasm Light"),
                url("fonts/Snasm_Light.otf") format("opentype"),
                url("hexglass/fonts/Snasm_Light.otf") format("opentype"),
                url("file:///usr/share/sddm/themes/hexglass/fonts/Snasm_Light.otf") format("opentype"),
                url("file://@HYPRDESK_HOME@/.config/hypr/hexglass/sddm/hexglass/fonts/Snasm_Light.otf") format("opentype"),
                url("file:///usr/local/share/fonts/hexglass/Snasm_Light.otf") format("opentype");
            font-style: normal;
            font-weight: 300;
            font-display: block;
        }


        /* =========================================================
           VARIABLES
        ========================================================= */

        :root {
            --bg-color: #030303;

            --text-main: #ffffff;
            --text-muted: #888888;

            --purple-dark: #1a1435;
            --purple-mid: #5d458f;
            --purple-bright: #ac81ff;

            --font-display: "Anurati", sans-serif;
            --font-secondary: "SNASM Light", monospace;
        }


        /* =========================================================
           RESET
        ========================================================= */

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =========================================================
           PAGE
        ========================================================= */

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: var(--bg-color);
            color: var(--text-main);

            font-family: var(--font-secondary);

            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* =========================================================
           BACKGROUND
        ========================================================= */

        .background {
            position: fixed;
            inset: 0;

            z-index: 0;

            background:
                radial-gradient(
                    circle at 50% 100%,
                    #ac81ff 0%,
                    #5d458f 25%,
                    #1a1435 65%,
                    #0a0715 100%
                );
        }


        /* =========================================================
           STARS
        ========================================================= */

        .stars {
            position: fixed;
            inset: 0;

            z-index: 1;

            background-image:
                radial-gradient(
                    1px 1px at 20px 30px,
                    #ffffff,
                    rgba(0, 0, 0, 0)
                ),
                radial-gradient(
                    1px 1px at 40px 70px,
                    #ffffff,
                    rgba(0, 0, 0, 0)
                ),
                radial-gradient(
                    2px 2px at 90px 40px,
                    #ffffff,
                    rgba(0, 0, 0, 0)
                ),
                radial-gradient(
                    1.5px 1.5px at 160px 120px,
                    rgba(255, 255, 255, 0.8),
                    rgba(0, 0, 0, 0)
                );

            background-repeat: repeat;
            background-size: 300px 300px;

            opacity: 0.4;

            animation: drift 100s linear infinite;
        }

        @keyframes drift {

            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(-300px);
            }

        }


        /* =========================================================
           MAIN CONTENT
        ========================================================= */

        .content-wrapper {
            position: fixed;
            inset: 0;

            z-index: 10;

            width: 100%;
            height: 100%;

            display: flex;
            justify-content: center;
            align-items: center;

            opacity: 0;

            transform: scale(0.96);

            animation:
                fadeInScale
                1.1s
                cubic-bezier(0.16, 1, 0.3, 1)
                0.05s
                forwards;
        }

        @keyframes fadeInScale {

            0% {
                opacity: 0;
                transform: scale(0.96);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }

        }


        /* =========================================================
           SVG
        ========================================================= */

        .svg-container {
            width: min(100vw, 1400px);
            height: min(60vh, 400px);

            display: block;

            overflow: visible;

            /*
             * Moves the artwork slightly upward so the
             * login field has a natural relationship to it.
             */
            transform: translateY(-48px);
        }


        /* =========================================================
           TRACE TEXT
        ========================================================= */

        .trace-text {
            fill: transparent;

            stroke-width: 1.5px;

            stroke-dasharray: 4000;
            stroke-dashoffset: -4000;

            text-anchor: middle;
            dominant-baseline: middle;

            text-transform: uppercase;

            animation:
                vectorTrace
                3.2s
                cubic-bezier(0.2, 0, 0.2, 1)
                0.05s
                forwards;
        }


        /* =========================================================
           TRACE ANIMATION
        ========================================================= */

        @keyframes vectorTrace {

            0% {
                stroke-dashoffset: -4000;

                fill: transparent;

                stroke: rgba(255, 255, 255, 1);
            }

            70% {
                stroke-dashoffset: 0;

                fill: transparent;

                stroke: rgba(255, 255, 255, 1);

                filter:
                    drop-shadow(
                        0 0 8px
                        rgba(255, 255, 255, 0.8)
                    );
            }

            100% {
                stroke-dashoffset: 0;

                fill: #ffffff;

                stroke: transparent;

                filter:
                    drop-shadow(
                        0 0 15px
                        rgba(255, 255, 255, 0.3)
                    );
            }

        }


        /* =========================================================
           GREETING
        ========================================================= */

        .greeting-display {
            font-family: "Anurati", sans-serif;

            font-size: 55px;

            font-weight: 400;

            letter-spacing: 0.15em;

            fill: #ffffff;

            stroke: #ffffff;
        }


        /* =========================================================
           DAY
        ========================================================= */

        .day-display {
            font-family: "SNASM Light", monospace;

            font-size: 24px;

            font-weight: 300;

            letter-spacing: 0.30em;

            fill: #ffffff;

            stroke: #ffffff;
        }


        /* =========================================================
           DATE
        ========================================================= */

        .date-display {
            font-family: "SNASM Light", monospace;

            font-size: 20px;

            font-weight: 300;

            letter-spacing: 0.20em;

            fill: var(--text-muted);

            stroke: var(--text-muted);

            stroke-width: 0.5px;
        }


        /* =========================================================
           TIME
        ========================================================= */

        .time-display {
            font-family: "SNASM Light", monospace;

            font-size: 16px;

            font-weight: 300;

            letter-spacing: 0.15em;

            fill: var(--text-muted);

            stroke: var(--text-muted);

            stroke-width: 0.5px;
        }


        /* =========================================================
           LOGIN STACK
        ========================================================= */

        .login-stack {
            position: fixed;

            left: 50%;
            top: 50%;

            z-index: 20;

            width: min(340px, calc(100vw - 40px));

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 12px;

            opacity: 0;

            /*
             * The login is anchored to the screen center
             * instead of using top: 58%, making alignment
             * consistent across resolutions.
             */
            transform: translate(-50%, 125px);

            animation:
                loginFade
                0.7s
                cubic-bezier(0.16, 1, 0.3, 1)
                0.95s
                forwards;
        }

        @keyframes loginFade {

            0% {
                opacity: 0;

                transform:
                    translate(-50%, 145px);
            }

            100% {
                opacity: 1;

                transform:
                    translate(-50%, 125px);
            }

        }


        /* =========================================================
           PASSWORD PILL
        ========================================================= */

        .pill {
            width: 340px;
            max-width: 100%;

            height: 56px;

            border-radius: 28px;

            background:
                rgba(10, 7, 21, 0.55);

            border:
                2px solid #5d458f;

            display: flex;

            align-items: center;

            justify-content: center;

            backdrop-filter: blur(6px);

            transition:
                border-color 0.25s ease,
                box-shadow 0.25s ease;
        }

        .pill.focused {
            border-color: #ac81ff;

            box-shadow:
                0 0 18px
                rgba(172, 129, 255, 0.45);
        }

        .pill.shake {
            animation: shake 0.30s;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-12px);
            }

            50% {
                transform: translateX(12px);
            }

            75% {
                transform: translateX(-8px);
            }

        }


        /* =========================================================
           PASSWORD INPUT
        ========================================================= */

        .pill input {
            width: 100%;
            height: 100%;

            padding: 0 20px;

            background: transparent;

            border: none;

            outline: none;

            color: #ffffff;

            font-family:
                "SNASM Light",
                monospace;

            font-size: 18px;

            letter-spacing: 6px;

            text-align: center;
        }

        .pill input::placeholder {
            color: #888888;

            letter-spacing: 2px;
        }


        /* =========================================================
           LOGIN STATUS
        ========================================================= */

        .status {
            min-height: 16px;

            font-family:
                "SNASM Light",
                monospace;

            font-size: 13px;

            letter-spacing: 0.2em;

            color: #888888;

            text-align: center;
        }

        .status.fail {
            color: #b3648b;
        }


        /* =========================================================
           BOTTOM BAR
        ========================================================= */

        .bottom {
            position: fixed;

            left: clamp(18px, 3vw, 36px);
            right: clamp(18px, 3vw, 36px);
            bottom: clamp(18px, 3vw, 36px);

            z-index: 20;

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;

            opacity: 0;

            animation:
                bottomFade
                0.7s
                ease-out
                1.25s
                forwards;
        }

        @keyframes bottomFade {

            from {
                opacity: 0;

                transform:
                    translateY(12px);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0);
            }

        }


        /* =========================================================
           BOTTOM CONTROLS
        ========================================================= */

        .bottom select,
        .bottom button {
            background:
                rgba(26, 20, 53, 0.55);

            border:
                1px solid
                rgba(93, 69, 143, 0.6);

            color: #ffffff;

            font-family:
                "SNASM Light",
                monospace;

            font-size: 12px;

            letter-spacing: 0.15em;

            padding: 8px 14px;

            border-radius: 17px;

            backdrop-filter: blur(4px);

            transition:
                border-color 0.25s ease,
                color 0.25s ease,
                box-shadow 0.25s ease;
        }

        .bottom button {
            cursor: pointer;
        }

        .bottom button:hover {
            border-color: #ac81ff;

            color: #ac81ff;

            box-shadow:
                0 0 12px
                rgba(172, 129, 255, 0.2);
        }

        .bottom select:focus,
        .bottom button:focus {
            outline: 1px solid #ac81ff;
        }


        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 700px) {

            .svg-container {
                width: 100vw;

                height: 55vh;

                transform:
                    translateY(-30px);
            }

            .greeting-display {
                font-size: 34px;

                letter-spacing: 0.10em;
            }

            .day-display {
                font-size: 18px;

                letter-spacing: 0.15em;
            }

            .date-display {
                font-size: 14px;

                letter-spacing: 0.10em;
            }

            .time-display {
                font-size: 12px;

                letter-spacing: 0.10em;
            }

            .login-stack {
                width: calc(100vw - 40px);

                transform:
                    translate(-50%, 110px);
            }

            @keyframes loginFade {

                0% {
                    opacity: 0;

                    transform:
                        translate(-50%, 130px);
                }

                100% {
                    opacity: 1;

                    transform:
                        translate(-50%, 110px);
                }

            }

            .pill {
                width: 100%;
            }

            .bottom {
                flex-direction: column;

                align-items: stretch;

                gap: 10px;
            }

            .bottom > div {
                display: flex;

                justify-content: center;

                align-items: center;

                gap: 8px;

                flex-wrap: wrap;
            }

            .bottom select,
            .bottom button {
                font-size: 11px;

                padding: 7px 11px;
            }

        }


        /* =========================================================
           VERY SMALL SCREENS
        ========================================================= */

        @media (max-height: 650px) {

            .svg-container {
                transform:
                    translateY(-65px)
                    scale(0.90);
            }

            .login-stack {
                transform:
                    translate(-50%, 95px);
            }

            @keyframes loginFade {

                0% {
                    opacity: 0;

                    transform:
                        translate(-50%, 115px);
                }

                100% {
                    opacity: 1;

                    transform:
                        translate(-50%, 95px);
                }

            }

            .bottom {
                bottom: 12px;
            }

        }

    </style>
</head>


<body>

    <!-- =========================================================
         BACKGROUND
    ========================================================== -->

    <div class="background"></div>

    <div class="stars"></div>


    <!-- =========================================================
         MAIN CONTENT
    ========================================================== -->

    <div class="content-wrapper">

        <svg
            class="svg-container"
            viewBox="0 0 1400 400"
            preserveAspectRatio="xMidYMid meet"
        >

            <defs>

                <filter
                    id="glow"
                    x="-20%"
                    y="-20%"
                    width="140%"
                    height="140%"
                >

                    <feGaussianBlur
                        stdDeviation="3"
                        result="blur"
                    />

                    <feComposite
                        in="SourceGraphic"
                        in2="blur"
                        operator="over"
                    />

                </filter>

            </defs>


            <!-- =================================================
                 GREETING
            ================================================== -->

            <text
                x="700"
                y="110"
                class="trace-text greeting-display"
                id="greeting-text"
                filter="url(#glow)"
            ></text>


            <!-- =================================================
                 DAY
            ================================================== -->

            <text
                x="700"
                y="185"
                class="trace-text day-display"
                id="day-text"
                filter="url(#glow)"
            ></text>


            <!-- =================================================
                 DATE
            ================================================== -->

            <text
                x="700"
                y="230"
                class="trace-text date-display"
                id="date-text"
            ></text>


            <!-- =================================================
                 TIME
            ================================================== -->

            <text
                x="700"
                y="265"
                class="trace-text time-display"
                id="time-text"
            ></text>

        </svg>

    </div>


    <!-- =========================================================
         LOGIN
    ========================================================== -->

    <div
        class="login-stack"
        id="login-stack"
    >

        <div
            class="pill"
            id="pill"
        >

            <input
                id="password"
                type="password"
                placeholder="type password"
                autocomplete="off"
            />

        </div>

        <div
            class="status"
            id="status"
        ></div>

    </div>


    <!-- =========================================================
         BOTTOM CONTROLS
    ========================================================== -->

    <div
        class="bottom"
        id="bottom-bar"
    >

        <div>

            <select id="session"></select>

            <select
                id="users"
                style="display:none"
            ></select>

        </div>

        <div>

            <button
                id="btn-suspend"
                style="display:none"
            >
                SLEEP
            </button>

            <button id="btn-reboot">
                REBOOT
            </button>

            <button id="btn-power">
                POWER
            </button>

        </div>

    </div>


    <!-- =========================================================
         JAVASCRIPT
    ========================================================== -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            () => {

                const greetingEl =
                    document.getElementById(
                        "greeting-text"
                    );

                const dayEl =
                    document.getElementById(
                        "day-text"
                    );

                const dateEl =
                    document.getElementById(
                        "date-text"
                    );

                const timeEl =
                    document.getElementById(
                        "time-text"
                    );


                /* =================================================
                   USER
                ================================================= */

                function getUser() {

                    try {

                        return (
                            typeof userModel !== "undefined" &&
                            userModel.lastUser
                        )
                            ? userModel.lastUser
                            : "hexagon";

                    } catch (e) {

                        return "hexagon";

                    }

                }


                greetingEl.textContent =
                    "WELCOME BACK, " +
                    getUser().toUpperCase();


                /* =================================================
                   DAYS
                ================================================= */

                const days = [
                    "SUNDAY",
                    "MONDAY",
                    "TUESDAY",
                    "WEDNESDAY",
                    "THURSDAY",
                    "FRIDAY",
                    "SATURDAY"
                ];


                /* =================================================
                   MONTHS
                ================================================= */

                const months = [
                    "JAN",
                    "FEB",
                    "MAR",
                    "APR",
                    "MAY",
                    "JUN",
                    "JUL",
                    "AUG",
                    "SEP",
                    "OCT",
                    "NOV",
                    "DEC"
                ];


                /* =================================================
                   CLOCK
                ================================================= */

                function updateTime() {

                    const now =
                        new Date();


                    const dayStr =
                        days[now.getDay()];


                    const dateStr =
                        `${String(
                            now.getDate()
                        ).padStart(2, "0")} ` +
                        `${months[
                            now.getMonth()
                        ]} ` +
                        `${now.getFullYear()}`;


                    let hours =
                        now.getHours();


                    const ampm =
                        hours >= 12
                            ? "PM"
                            : "AM";


                    hours =
                        hours % 12;


                    hours =
                        hours || 12;


                    const minutes =
                        String(
                            now.getMinutes()
                        ).padStart(2, "0");


                    const timeStr =
                        `- ${String(
                            hours
                        ).padStart(
                            2,
                            "0"
                        )}:${minutes} ${ampm} -`;


                    if (
                        dayEl.textContent !==
                        dayStr
                    ) {
                        dayEl.textContent =
                            dayStr;
                    }


                    if (
                        dateEl.textContent !==
                        dateStr
                    ) {
                        dateEl.textContent =
                            dateStr;
                    }


                    if (
                        timeEl.textContent !==
                        timeStr
                    ) {
                        timeEl.textContent =
                            timeStr;
                    }

                }


                updateTime();


                setInterval(
                    updateTime,
                    1000
                );


                /* =================================================
                   SDDM VARIABLES
                ================================================= */

                let sddmObj =
                    (
                        typeof sddm !==
                        "undefined"
                    )
                        ? sddm
                        : null;


                let sessionNames = [];

                let userNames = [];

                let lastUser =
                    getUser();

                let lastSessionIdx = 0;

                let lastUserIdx = -1;

                let canSuspend = false;

                let canReboot = true;

                let canPowerOff = true;


                /* =================================================
                   SDDM INJECTION
                ================================================= */

                window.injectSddmData =
                    function (
                        sessions,
                        users,
                        lu,
                        lsi,
                        lui,
                        cs,
                        cr,
                        cpo
                    ) {

                        sessionNames =
                            sessions || [];

                        userNames =
                            users || [];

                        // lu may be "" (empty) from userBridge.lastUser when no lastUser set - fallback to first user or getUser()
                        lastUser =
                            (lu && String(lu).length > 0) ? lu : (users && users.length > 0 ? users[0] : getUser());

                        lastSessionIdx =
                            (
                                typeof lsi ===
                                "number"
                            )
                                ? lsi
                                : 0;

                        lastUserIdx =
                            (
                                typeof lui ===
                                "number"
                            )
                                ? lui
                                : -1;

                        canSuspend =
                            !!cs;

                        canReboot =
                            cr !== false;

                        canPowerOff =
                            cpo !== false;


                        console.log("hexglass injectSddmData", JSON.stringify(sessions), JSON.stringify(users), "lastUser", lastUser, "lastSessionIdx", lastSessionIdx);

                        greetingEl.textContent =
                            "WELCOME BACK, " +
                            String(
                                lastUser
                            ).toUpperCase();


                        populateFromInjected();

                        updatePowerButtons();

                    };


                /* =================================================
                   WEB CHANNEL
                ================================================= */

                function setupWebChannel() {

                    if (
                        typeof qt !==
                        "undefined" &&
                        qt.webChannelTransport
                    ) {

                        try {

                            new QWebChannel(
                                qt.webChannelTransport,
                                function (ch) {

                                    console.log(
                                        "hexglass: WebChannel connected",
                                        Object.keys(
                                            ch.objects
                                        )
                                    );


                                    if (
                                        ch.objects.sddm
                                    ) {

                                        sddmObj =
                                            ch.objects.sddm;

                                    }


                                    if (
                                        ch.objects.sessionModel
                                    ) {
                                        // Session/User data is injected via Main.qml runJavaScript injectSddmData()
                                        // (QML can call sessionBridge.nameAt synchronously, JS cannot).
                                        // Don't populate via WebChannel sync call - it would be async and return undefined.
                                        // Just keep the injected values; WebChannel is only for sddm object.
                                        console.log("hexglass: sessionModel via WebChannel - ignoring, using injectSddmData");
                                    }


                                    if (
                                        ch.objects.userModel
                                    ) {
                                        console.log("hexglass: userModel via WebChannel - ignoring, using injectSddmData");
                                    }


                                    if (sddmObj) {

                                        try {

                                            canSuspend =
                                                sddmObj.canSuspend;

                                            canReboot =
                                                sddmObj.canReboot;

                                            canPowerOff =
                                                sddmObj.canPowerOff;

                                        } catch (e) {}


                                        if (
                                            sddmObj.loginSucceeded &&
                                            sddmObj.loginSucceeded.connect
                                        ) {

                                            sddmObj
                                                .loginSucceeded
                                                .connect(
                                                    function () {

                                                        window
                                                            .onSddmLoginSucceeded &&
                                                            window
                                                                .onSddmLoginSucceeded();

                                                    }
                                                );

                                        }


                                        if (
                                            sddmObj.loginFailed &&
                                            sddmObj.loginFailed.connect
                                        ) {

                                            sddmObj
                                                .loginFailed
                                                .connect(
                                                    function () {

                                                        window
                                                            .onSddmLoginFailed &&
                                                            window
                                                                .onSddmLoginFailed();

                                                    }
                                                );

                                        }

                                    }


                                    if (
                                        sessionNames.length ||
                                        userNames.length
                                    ) {

                                        greetingEl.textContent =
                                            "WELCOME BACK, " +
                                            String(
                                                lastUser
                                            ).toUpperCase();


                                        populateFromInjected();

                                        updatePowerButtons();

                                    }

                                }
                            );

                        } catch (e) {

                            console.log(
                                "QWebChannel init failed",
                                e
                            );

                        }

                    } else {

                        if (
                            typeof sddm !==
                            "undefined"
                        ) {

                            sddmObj =
                                sddm;

                            try {

                                canSuspend =
                                    sddm.canSuspend;

                                canReboot =
                                    sddm.canReboot;

                                canPowerOff =
                                    sddm.canPowerOff;

                            } catch (e) {}

                        }

                    }

                }


                setTimeout(
                    setupWebChannel,
                    50
                );

                setTimeout(
                    setupWebChannel,
                    300
                );

                setTimeout(
                    setupWebChannel,
                    1000
                );


                /* =================================================
                   POPULATE SDDM DATA
                ================================================= */

                function populateFromInjected() {

                    const sel =
                        document.getElementById(
                            "session"
                        );

                    const users =
                        document.getElementById(
                            "users"
                        );


                    sel.innerHTML = "";


                    if (
                        sessionNames.length ===
                        0
                    ) {

                        const o =
                            document.createElement(
                                "option"
                            );

                        o.value = 0;

                        o.textContent =
                            "Hyprland";

                        sel.appendChild(o);

                    } else {

                        sessionNames.forEach(
                            (n, i) => {

                                const o =
                                    document.createElement(
                                        "option"
                                    );

                                o.value = i;

                                o.textContent = n;

                                sel.appendChild(o);

                            }
                        );


                        let idx =
                            lastSessionIdx;


                        for (
                            let i = 0;
                            i < sessionNames.length;
                            i++
                        ) {

                            if (
                                sessionNames[i] ===
                                "Hyprland"
                            ) {

                                idx = i;

                                break;

                            }

                        }


                        if (
                            idx < 0 ||
                            idx >=
                            sessionNames.length
                        ) {

                            idx = 0;

                        }


                        sel.value = idx;

                    }


                    if (
                        userNames.length > 1
                    ) {

                        users.style.display =
                            "";

                        users.innerHTML =
                            "";


                        userNames.forEach(
                            n => {

                                const o =
                                    document.createElement(
                                        "option"
                                    );

                                o.value = n;

                                o.textContent = n;

                                users.appendChild(o);

                            }
                        );


                        users.value =
                            (
                                lastUserIdx >= 0 &&
                                lastUserIdx <
                                userNames.length
                            )
                                ? userNames[
                                    lastUserIdx
                                ]
                                : userNames[0];


                        users.onchange =
                            () => {

                                const v =
                                    users.value;


                                greetingEl.textContent =
                                    "WELCOME BACK, " +
                                    String(
                                        v
                                    ).toUpperCase();


                                const pw =
                                    document.getElementById(
                                        "password"
                                    );


                                pw.value = "";

                                pw.focus();

                            };

                    } else {

                        users.style.display =
                            "none";

                    }

                }


                /* =================================================
                   POWER BUTTONS
                ================================================= */

                function updatePowerButtons() {

                    const sus =
                        document.getElementById(
                            "btn-suspend"
                        );

                    const reb =
                        document.getElementById(
                            "btn-reboot"
                        );

                    const pow =
                        document.getElementById(
                            "btn-power"
                        );


                    if (sus) {

                        sus.style.display =
                            canSuspend
                                ? ""
                                : "none";


                        sus.onclick =
                            () => {

                                if (
                                    sddmObj
                                ) {

                                    sddmObj.suspend();

                                } else {

                                    location.reload();

                                }

                            };

                    }


                    if (reb) {

                        reb.onclick =
                            () => {

                                if (
                                    sddmObj
                                ) {

                                    sddmObj.reboot();

                                } else {

                                    location.reload();

                                }

                            };

                    }


                    if (pow) {

                        pow.onclick =
                            () => {

                                if (
                                    sddmObj
                                ) {

                                    sddmObj.powerOff();

                                } else {

                                    console.log(
                                        "power"
                                    );

                                }

                            };

                    }

                }


                /* =================================================
                   ELEMENTS
                ================================================= */

                const sel =
                    document.getElementById(
                        "session"
                    );

                const users =
                    document.getElementById(
                        "users"
                    );

                const pill =
                    document.getElementById(
                        "pill"
                    );

                const password =
                    document.getElementById(
                        "password"
                    );

                const status =
                    document.getElementById(
                        "status"
                    );


                /* =================================================
                   LOGIN FAILED
                ================================================= */

                window.onSddmLoginFailed =
                    () => {

                        password.disabled =
                            false;

                        password.value =
                            "";

                        password.focus();


                        status.textContent =
                            "ACCESS DENIED";

                        status.className =
                            "status fail";


                        pill.classList.remove(
                            "shake"
                        );


                        void pill.offsetWidth;


                        pill.classList.add(
                            "shake"
                        );


                        setTimeout(
                            () => {

                                status.textContent =
                                    "";

                            },
                            2500
                        );

                    };


                /* =================================================
                   LOGIN SUCCESS
                ================================================= */

                window.onSddmLoginSucceeded =
                    () => {

                        status.textContent =
                            "WELCOME";

                        status.className =
                            "status";

                    };


                /* =================================================
                   DIRECT SDDM FALLBACK
                ================================================= */

                try {

                    if (
                        typeof sddm !==
                        "undefined" &&
                        sddm.onLoginFailed ===
                        undefined &&
                        sddm.loginFailed &&
                        sddm.loginFailed.connect
                    ) {

                        // WebChannel style already handled.

                    } else if (
                        typeof sddm !==
                        "undefined"
                    ) {

                        sddm.onLoginFailed =
                            window.onSddmLoginFailed;

                        sddm.onLoginSucceeded =
                            window.onSddmLoginSucceeded;

                    }

                } catch (e) {}


                /* =================================================
                   LEGACY POPULATE
                ================================================= */

                function populate() {

                    try {

                        if (
                            typeof sessionModel !==
                            "undefined" &&
                            sel.options.length === 0
                        ) {

                            sel.innerHTML =
                                "";


                            for (
                                let i = 0;
                                i <
                                sessionModel.count;
                                i++
                            ) {

                                const o =
                                    document.createElement(
                                        "option"
                                    );

                                o.value = i;

                                o.textContent =
                                    sessionModel.name ||
                                    "Session " + i;

                                sel.appendChild(o);

                            }


                            let idx =
                                sessionModel.lastIndex;


                            if (
                                idx < 0
                            ) {

                                idx = 0;

                            }


                            sel.value =
                                idx;

                        }


                        if (
                            typeof userModel !==
                            "undefined" &&
                            userModel.count > 1 &&
                            users.style.display ===
                            "none"
                        ) {

                            users.style.display =
                                "";


                            users.innerHTML =
                                "";


                            for (
                                let i = 0;
                                i <
                                userModel.count;
                                i++
                            ) {

                                const o =
                                    document.createElement(
                                        "option"
                                    );

                                o.value =
                                    userModel.name ||
                                    i;

                                o.textContent =
                                    userModel.name ||
                                    i;

                                users.appendChild(o);

                            }


                            users.value =
                                userModel.lastIndex >= 0
                                    ? userModel.lastIndex
                                    : 0;

                        }

                    } catch (e) {}

                }


                populate();

                updatePowerButtons();


                /* =================================================
                   PASSWORD INTERACTION
                ================================================= */

                if (
                    pill &&
                    password
                ) {

                    password.addEventListener(
                        "focus",
                        () => {

                            pill.classList.add(
                                "focused"
                            );

                        }
                    );


                    password.addEventListener(
                        "blur",
                        () => {

                            pill.classList.remove(
                                "focused"
                            );

                        }
                    );


                    pill.addEventListener(
                        "click",
                        () => {

                            password.focus();

                        }
                    );


                    /* =================================================
                       LOGIN
                    ================================================= */

                    function doLogin() {

                        if (
                            !password.value
                        ) {

                            return;

                        }


                        status.textContent =
                            "SIGNING IN";

                        status.className =
                            "status";


                        password.disabled =
                            true;


                        const targetSddm =
                            sddmObj ||
                            (
                                typeof sddm !==
                                "undefined"
                                    ? sddm
                                    : null
                            );


                        if (
                            targetSddm
                        ) {

                            const user =
                                (
                                    users.style.display !==
                                    "none" &&
                                    users.value
                                )
                                    ? String(
                                        users.value
                                    )
                                    : getUser();


                            const sid =
                                parseInt(
                                    sel.value ||
                                    0,
                                    10
                                );


                            try {

                                targetSddm.login(
                                    user,
                                    password.value,
                                    sid
                                );

                            } catch (e) {

                                console.log(
                                    "login err",
                                    e
                                );

                                password.disabled =
                                    false;

                            }

                        } else {

                            setTimeout(
                                () => {

                                    status.textContent =
                                        "PREVIEW — no SDDM daemon (would login)";

                                },
                                500
                            );


                            password.disabled =
                                false;

                        }

                    }


                    password.addEventListener(
                        "keydown",
                        e => {

                            if (
                                e.key ===
                                "Enter"
                            ) {

                                doLogin();

                            }


                            if (
                                e.key ===
                                "Escape"
                            ) {

                                password.value =
                                    "";

                            }

                        }
                    );


                    /* =================================================
                       POWER BUTTONS
                    ================================================= */

                    document.getElementById(
                        "btn-reboot"
                    ).onclick =
                        () => {

                            const t =
                                sddmObj ||
                                (
                                    typeof sddm !==
                                    "undefined"
                                        ? sddm
                                        : null
                                );


                            return t
                                ? t.reboot()
                                : location.reload();

                        };


                    document.getElementById(
                        "btn-power"
                    ).onclick =
                        () => {

                            const t =
                                sddmObj ||
                                (
                                    typeof sddm !==
                                    "undefined"
                                        ? sddm
                                        : null
                                );


                            return t
                                ? t.powerOff()
                                : console.log(
                                    "power"
                                );

                        };


                    const sus =
                        document.getElementById(
                            "btn-suspend"
                        );


                    if (sus) {

                        sus.onclick =
                            () => {

                                const t =
                                    sddmObj ||
                                    (
                                        typeof sddm !==
                                        "undefined"
                                            ? sddm
                                            : null
                                    );


                                if (
                                    t &&
                                    t.canSuspend
                                ) {

                                    t.suspend();

                                }

                            };

                    }


                    /*
                     * Focus the password field once the login
                     * animation has appeared.
                     */
                    setTimeout(
                        () => {

                            password.focus();

                        },
                        1250
                    );

                }

            }

        );

    </script>

</body>
</html>
