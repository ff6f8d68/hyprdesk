# default Monitor config

# *********************************************************** #
# 
# NOTE: This will be overwritten by NWG-Displays 
# once you use and click apply. You can still find this
# default at ~/.config/hypr/Monitor_Profiles/default.conf
#
# *********************************************************** #


# Monitor Configuration
# See Hyprland wiki for more details
# https://wiki.hyprland.org/Configuring/Monitors/
# Configure your Display resolution, offset, scale and Monitors here, use `hyprctl monitors` to get the info.

# Monitors
monitor=,preferred,auto,1

# NOTE: highrr and highres below are ALTERNATIVES to the line above, not
# additions — but all three were left uncommented, so all three matched every
# monitor and only the last one had any effect. Commented out, leaving
# `preferred` as the single catch-all for anything not named further down.

# High Refresh Rate
#monitor=,highrr,auto,1

# High Resolution
#monitor=,highres,auto,1

# NOTE: for laptop, kindly check notes in Laptops.conf regarding display
# Created this inorder for the monitor display to not wake up if not intended.
# See here: https://github.com/hyprwm/Hyprland/issues/4090

# Some examples to set your own monitor
#monitor = eDP-1, preferred, auto, 1
#monitor = eDP-1, 2560x1440@165, 0x0, 1 #own screen
#monitor = DP-3, 1920x1080@240, auto, 1 
#monitor = DP-1, preferred, auto, 1
#monitor = HDMI-A-1, preferred,auto,1

# QEMU-KVM, virtual box or vmware
#monitor = Virtual-1, 1920x1080@60,auto,1

# to disable a monitor
#monitor=name,disable

# Mirror samples
#monitor=DP-3,1920x1080@60,0x0,1,mirror,DP-2
#monitor=,preferred,auto,1,mirror,eDP-1
#monitor=HDMI-A-1,2560x1440@144,0x0,1,mirror,eDP-1

# 10 bit monitor support - See wiki https://wiki.hyprland.org/Configuring/Monitors/#10-bit-support - See NOTES below
# NOTE: Colors registered in Hyprland (e.g. the border color) do not support 10 bit.
# NOTE: Some applications do not support screen capture with 10 bit enabled. (Screen captures like OBS may render black screen)
# monitor=,preferred,auto,1,bitdepth,10

#monitor=eDP-1,transform,0
#monitor=eDP-1,addreserved,10,10,10,49

# workspaces - Monitor rules
# https://wiki.hyprland.org/Configuring/Workspace-Rules/
# SUPER E - Workspace-Rules 
# See ~/.config/hypr/UserConfigs/WorkspaceRules.conf


# ══════════════════════════════════════════════════════════════════════════
# MAIN SCREEN
# ══════════════════════════════════════════════════════════════════════════
# The Samsung LS24AG30x (HDMI-A-1) is the main screen and sits at the origin,
# so it is the screen the session is laid out from. The ThinkPad panel goes
# to its RIGHT, which is where it physically sits, so the pointer still
# crosses between the two screens in the direction you expect.
#
# `auto-right` states the relationship rather than a literal offset, so the
# panel lands to the right of whatever the main screen happens to be. It is NOT
# sufficient on its own for the unplugged case: Hyprland does not re-evaluate
# the rule of a monitor that is already present, so disabling the Samsung was
# measured to leave the panel parked off to one side rather than taking over.
# scripts/RaiseOnFocus.sh enforces both that fallback and this exact left/right
# arrangement on every monitor hotplug.
#
# These sit AFTER the catch-all above on purpose: monitor rules are applied in
# order and the last match wins, so these override `preferred,auto` for these
# two panels while the catch-all still covers anything else you plug in.
#
# Explicit modes rather than `preferred` because both are confirmed available
# (`hyprctl monitors`): the Samsung's preferred mode is its 144Hz one and
# naming it keeps that high refresh rate from being lost.
# `desc:Samsung Electric Company LS24AG30x` works in place of the connector
# name if you ever want the rule to follow the panel to a different port.
monitor = HDMI-A-1, 1920x1080@144, 0x0, 1
monitor = eDP-1, 1920x1080@60, auto-right, 1

