# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# Workspace rules — including the LAYER planes.
#
# NOTE: upstream ships this file as documentation only and never sourced it,
# telling you to edit ~/.config/hypr/workspaces.conf instead. That file is
# regenerated by nwg-displays whenever you hit Apply, which would silently
# wipe anything custom in it. So hyprland.conf now sources THIS file after
# workspaces.conf (last match wins), keeping user rules safe from nwg-displays.
#
# https://wiki.hyprland.org/Configuring/Workspace-Rules/

# ── LAYER PLANES ─────────────────────────────────────────────────────────
# Each layer is a named special workspace: a plane that floats above the
# normal workspace and tiles its windows independently. Driven by
# ~/.config/hypr/scripts/Layers.sh
#
#   SUPER ALT  + 1/2/3          raise layer, or lower it if already up
#   SUPER ALT SHIFT + 1/2/3     send focused window to a layer and follow it
#   SUPER ALT  + 0              hide whichever layer is up
#
# Hyprland only ever shows ONE special workspace per monitor, so these are
# stacked depths you flip between, not simultaneous overlays.
#
# The insets step outward per layer (16 -> 32 -> 48px, rounding 14 -> 24) so a
# higher plane visibly sits further up the stack. All three stay within the
# global dim_special / special_scale_factor look set in UserDecorations.conf.

workspace = special:layer1, gapsout:16, rounding:14, bordersize:2, decorate:true
workspace = special:layer2, gapsout:32, rounding:19, bordersize:2, decorate:true
workspace = special:layer3, gapsout:48, rounding:24, bordersize:2, decorate:true

# Keep the dropterm's own scratchpad as it was
workspace = special:scratchpad, gapsout:16, rounding:14, bordersize:2, decorate:true
