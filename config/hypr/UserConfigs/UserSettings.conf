# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# User Settings
# This is where you put your own settings as this will not be touched during update 
# if the upgrade.sh is used.

# refer to Hyprland wiki for more info https://wiki.hyprland.org/Configuring/Variables/
# NOTE: some settings are in ~/.config/hypr/UserConfigs/UserDecorAnimations.conf
#
# Look on ~/.config/hypr/configs/SystemSettings.conf to know how to modify this


# ── FREE-FORM WINDOWS: drag, drop, overlap ──────────────────────────────
# Tiling is the default, but any window can be lifted out of the layout and
# placed by hand — including on top of another window:
#
#   SUPER + SPACE              float / un-float the focused window
#   SUPER + left-drag          move a window (drag it wherever you want)
#   SUPER + right-drag         resize a window
#   SUPER + left-drag across
#     the screen edge          hand the window to the other monitor
#   SUPER CTRL ALT + arrow     same thing from the keyboard
#
# Hyprland always paints floating windows above tiled ones, and clicking a
# floating window raises it to the top of the stack, so windows can be piled
# up and restacked by clicking. Nothing else needs enabling for that.
#
# `snap` is what makes the drop targets predictable: while you drag, the
# window magnetically aligns to the edges of the other windows and to the
# monitor edge, leaving window_gap between them. Without it, a dragged
# window just stops wherever the cursor is.

general {
    snap {
        enabled = true
        window_gap = 10      # px left between a snapped window and its neighbour
        monitor_gap = 10     # px left between a snapped window and the screen edge
        # Hyprland silently ignores snapping while borders may overlap content
        border_overlap = false
    }
}


# ── CLICK TO FOCUS (and click to bring to the front) ────────────────────
#   follow_mouse = 0  ->  a window takes focus when you CLICK it
#   follow_mouse = 1  ->  a window takes focus when you HOVER it  (was the default)
#
# This is set to 0 because overlapping windows were asked to behave "like a
# normal desktop: click any window and it raises". Hyprland has no
# raise-on-focus option at all — focusing a floating window provably leaves it
# buried under the window covering it — so raising is done for you by
# ~/.config/hypr/scripts/RaiseOnFocus.sh, which runs on every focus change.
#
# With follow_mouse = 1 that script would fire on HOVER, so windows would jump
# to the front as the pointer merely swept across a pile of them. Click to
# focus keeps the raise tied to the click that caused it.
#
# Trade-off: tiling loses hover-to-focus, so you click a tile to switch to it.
# Change this back to 1 for hover focus — but then expect float-stacking to
# reshuffle as the pointer moves.

input {
    follow_mouse = 0
}
input:kb_layout = de
general:layout = master
