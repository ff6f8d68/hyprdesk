# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# For window rules and layerrules
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# This file is used to add or overwrite window rules 
# This file will not be modified during dotfiles updates

# ── EVERYTHING FLOATS ────────────────────────────────────────────────────
# This is a free-form desktop: nothing tiles. Every window is floating, so it
# can be dragged anywhere, stacked on top of another, and raised by clicking
# it. `float on` with a catch-all class match is how that is expressed —
# Hyprland's general:layout only accepts dwindle or master, there is no
# "float" layout to select.
#
# Everything the free-form desktop leans on composes with this:
#   click to raise       -> scripts/RaiseOnFocus.sh
#   snap while dragging  -> general:snap in UserSettings.conf
#   tile one back        -> SUPER SPACE, or SUPER CTRL + middle-click
#
# Deliberately FIRST: rules apply in order and later ones win, so the
# app-specific rules below can still override this for individual windows.
#
# Note: a rule only binds when a window is created, so windows that were
# already open stay as they were until they are re-created or floated by
# hand — scripts/FloatAll.sh does that in one pass.

windowrule = match:class .*, float on

# Windows keep their natural size — no forced card/max size.
# Previously a card rule `size/max_size (monitor_w*0.6) (monitor_h*0.65)`
# forced every window (including MCreator Java dialogs `WM_WINDOW_TYPE_DIALOG`
# like "win2" 134x256) to 1152x702, making popups "way too big".
# And `center on` for popups/dialogs offset them from their parent-relative
# position. Removing both restores free resize and parent-relative popup
# placement (xwininfo showed popups at e.g. +2348+269 near parent).


# ── UNIFIED GLASS: layer rules ───────────────────────────────────────────
# Every surface of the glass desktop lives on a layer shell, so each one
# needs an explicit blur rule — otherwise the translucent CSS backgrounds
# in glass.css would render as flat, unblurred colour.
# Companion styling: ~/.config/hypr/glass.css

# Bar
layerrule = match:namespace waybar, blur on
layerrule = match:namespace waybar, ignore_alpha 0.2

# App menu / launchpad (rofi)
layerrule = match:namespace rofi, blur on
layerrule = match:namespace rofi, ignore_alpha 0.2

# Dock (nwg-dock — Go builds report "nwg-dock", Rust builds "nwg-dock-hyprland")
layerrule = match:namespace nwg-dock, blur on
layerrule = match:namespace nwg-dock, ignore_alpha 0.2
layerrule = match:namespace nwg-dock-hyprland, blur on
layerrule = match:namespace nwg-dock-hyprland, ignore_alpha 0.2

# Notifications + control centre (swaync)
layerrule = match:namespace notifications, blur on
layerrule = match:namespace swaync-notification-window, blur on
layerrule = match:namespace swaync-notification-window, ignore_alpha 0.2
layerrule = match:namespace swaync-control-center, blur on
layerrule = match:namespace swaync-control-center, ignore_alpha 0.2

# ── MINIMUM WINDOW SIZES ─────────────────────────────────────────────────
# Tiling ignores the size hints apps declare for themselves, so a chat or
# browser window can be squished into a slot smaller than the app supports
# and the UI falls apart (Discord's sidebar and member list are the usual
# casualty). min_size re-imposes a floor per app in tiled layouts, and
# dwindle will shrink the *neighbours* instead of breaking the window.
#
# Rules only apply to windows created after the rule exists, so a config
# reload won't resize anything that is already open.
#
# Sizes measured from the apps' own WM_SIZE_HINTS rather than guessed:
#   min_size  W  H   from
#   ---------------  ---------------------------------------------
#   discord  832x542 Discord's own declared minimum (verified by forcing
#                    it to 200x200 while floating — it clamped at 832x542)
#   code     400x270 VS Code's own declared minimum
# The rest are conservative floors for apps known to mangle layout.

windowrule = match:class ^(discord|Discord)$, min_size 832 542
windowrule = match:class ^(code|Code|VSCodium|codium)$, min_size 400 270

# Electron / Chromium-shell desktops
windowrule = match:class ^(slack|Slack)$, min_size 800 600
windowrule = match:class ^(spotify|Spotify)$, min_size 700 450
windowrule = match:class ^(obsidian|Obsidian)$, min_size 500 400
windowrule = match:class ^(notion|Notion|Notion-enhanced)$, min_size 600 450
windowrule = match:class ^(org\.telegram\.desktop|TelegramDesktop)$, min_size 600 480
windowrule = match:class ^(Signal|signal-desktop|org\.signal\.Signal)$, min_size 600 480
windowrule = match:class ^(Element|element-desktop|io\.element\.Element)$, min_size 700 500
windowrule = match:class ^(Bitwarden|bitwarden)$, min_size 500 450

# Heavier desktop apps that hide panels rather than reflow
windowrule = match:class ^(blender|Blender)$, min_size 900 600
windowrule = match:class ^(jetbrains-.*|.*idea.*|pycharm.*|webstorm.*|clion.*|goland.*|rustrover.*)$, min_size 900 600
windowrule = match:class ^(virt-manager|org\.virt-manager\.virt-manager)$, min_size 800 600
windowrule = match:class ^(qemu-system-.*)$, min_size 640 480

# ── hyprbars: no titlebar on things that are not really windows ────────────
# hyprbars decorates every window it is given and has no filtering of its own
# (checked in its source — there is no popup or dialog test anywhere), and the
# catch-all `float on` rule above forces everything to float, so without this
# every modal prompt would grow a titlebar too, which just eats a row of the
# dialog.
#
# These rules are NOT written here. `hyprbars:no_bar` is a field the plugin
# registers when it initialises, and Hyprland rejects an unknown field at parse
# time — "invalid field type hyprbars:no_bar", measured — so a rule naming it
# cannot live in a config that is also read with the plugin absent. It would
# also be read before the plugin loads at login, since exec-once runs after the
# config is parsed. scripts/LoadHyprbars.sh applies them at runtime, right
# after loading the plugin, which is the only point at which they are valid.
