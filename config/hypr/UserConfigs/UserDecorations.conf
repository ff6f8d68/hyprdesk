# Decoration Settings

# Hyprland Wiki Links
# Animation - https://wiki.hyprland.org/Configuring/Animations/
# Decoration - https://wiki.hyprland.org/Configuring/Variables/#decoration

# Sourcing colors generated by wallust
source = $HOME/.config/hypr/wallust/wallust-hyprland.conf

general {
  border_size = 2
  gaps_in = 2
  gaps_out = 4

  col.active_border = $color12
  col.inactive_border = $color10
}

decoration {
  rounding = 24
  
  active_opacity = 1
  inactive_opacity = 1
  fullscreen_opacity = 1.0

  dim_inactive = true
  dim_strength = 0.1
  dim_special = 0.8

  shadow {
    enabled = false
    range = 0
    render_power = 1

    color =  $color12
    color_inactive = $color10
  }

  # Glass base. These values are the reference for the layer surfaces too:
  # see ~/.config/hypr/glass.css (waybar, swaync, nwg-dock, rofi).
  # Layer rules granting blur are in UserConfigs/WindowRules.conf.
  blur {
    enabled = false
    size = 8
    passes = 3
    new_optimizations = true
    xray = true
    ignore_opacity = true
    special = true
    popups = true

    # Frost: keep blurred content legible behind translucent surfaces
    contrast = 1.05
    brightness = 1.10
    vibrancy = 1
    noise = 0.015
  }
}

group {
  col.border_active = $color10

	groupbar {
		col.active = $color0
  }
}

# ── hyprbars: a real titlebar on every window ──────────────────────────────
# Loaded as a plugin, not part of Hyprland, so it only exists once
# scripts/BuildHyprbars.sh has built it and it has been loaded (Startup_Apps.conf
# does that at login). Until then this block is inert: Hyprland stores plugin
# config without complaining, so the file stays valid either way.
#
# Why this is here at all: the session is entirely floating windows, so there
# are no titlebars to grab. hyprbars draws one, which is what makes a window
# draggable by pointer alone rather than by a modifier drag.
#
# Colours come from the wallust-generated $glass* vars, so the bars re-tint with
# the wallpaper. The alpha in those vars is not decoration — bar_blur only shows
# through a translucent fill.
plugin {
  hyprbars {
    bar_height = 22
    bar_color = $glassbar
    bar_blur = true
    col.text = $foreground

    bar_text_font = JetBrainsMono Nerd Font
    bar_text_size = 11
    bar_text_weight = medium
    bar_text_align = center

    # part_of_window + precedence_over_border keep the shadow and the 2px border
    # wrapping the whole card, bar included, instead of stopping at the bar and
    # leaving a visible seam across the window.
    bar_part_of_window = true
    bar_precedence_over_border = true

    bar_padding = 10
    bar_button_padding = 8
    icon_on_hover = false
    inactive_button_color = $color0

    # Right-hand buttons, closest to the edge first. Both glyphs are in the
    # installed JetBrainsMono Nerd Font (checked, not assumed).
    hyprbars-button = $glassred, 12, ✕, hyprctl dispatch killactive, $foreground
    hyprbars-button = $glassacc, 12, □, hyprctl dispatch fullscreen 1, $background

    # Double-clicking the bar (not a button) maximises, since there is no
    # window chrome to double-click otherwise.
    on_double_click = hyprctl dispatch fullscreen 1
  }
}
input:left_handed = false
general:resize_on_border = true
dwindle:preserve_split = false
misc:disable_hyprland_logo = false
misc:disable_splash_rendering = false

