# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# This is where you put your own keybinds. Be Mindful to check as well ~/.config/hypr/configs/Keybinds.conf to avoid conflict
# if you think I should replace the Pre-defined Keybinds in ~/.config/hypr/configs/Keybinds.conf , submit an issue or let me know in DC and present me a valid reason as to why, such as conflicting with global shortcuts, etc etc

# See https://wiki.hyprland.org/Configuring/Keywords/ for more settings and variables
# See also Laptops.conf for laptops keybinds 

# /* ---- ✴️ Variables ✴️ ---- */  #
$mainMod = SUPER
$scriptsDir = $HOME/.config/hypr/scripts
$UserScripts = $HOME/.config/hypr/UserScripts
$UserConfigs = $HOME/.config/hypr/UserConfigs

#  IMPORTANT: If you want to remap and existing keybind you MUST unbindd it first 

# The bindings are CASE SENSITIVE. We suggest you copy the exisitng binding here
#  Then change `bindd` to `unbind`

# E.g. 
# unbind = $mainMod, Return, Open terminal, exec, $term
# bindd = $mainMod, Return, Open terminal, exec, ghostty 
#
# unbind = $mainMod, E, file manager, exec, $files
# bindd = $mainMod, T, file manager, exec, $files

# If you are ADDING a bindd, make sure you include the description 
# Other the keybind search menu might not show it properly 

# E.g.
# bindd = $mainMod, Z, My z app, exec APPNAME









# For passthrough keyboard into a VM
# bind = $mainMod ALT, P, submap, passthru
#submap = passthru
# to unbind
#bind = $mainMod ALT, P, submap, reset
#submap = reset


# ── UNIFIED GLASS: launcher + dock ──────────────────────────────────────
# SUPER + D opens the glass launchpad. The dock's launcher button calls the
# same script, so both paths are identical (and both toggle closed again).
unbind = $mainMod, D
bindd = $mainMod, D, app launcher (glass launchpad), exec, $scriptsDir/RofiLaunchpad.sh

# SUPER SHIFT D hides/shows the dock without touching the rest of the session
bindd = $mainMod SHIFT, D, toggle dock, exec, sh -c 'pgrep -x nwg-dock >/dev/null && pkill -x nwg-dock || $HOME/.cargo/bin/nwg-dock'


# ── LAYERS: stacked planes above the workspace ──────────────────────────
# Each layer is a named special workspace that tiles its own windows
# independently and floats above your normal workspace. Hyprland only shows
# one special workspace per monitor, so raising another swaps planes.
#   SUPER ALT        + 1/2/3   raise a layer, or lower it if it is already up
#   SUPER ALT SHIFT  + 1/2/3   send the focused window to a layer and follow it
#   SUPER ALT        + 0       hide whichever layer is up
# Logic:      ~/.config/hypr/scripts/Layers.sh
# Plane style: UserConfigs/WorkSpaceRules.conf  (cascading insets per layer)
# NOTE: keys are written as key codes (code:10 = 1, code:11 = 2, code:12 = 3)
# so they keep working on the de layout, matching Keybinds.conf's style.

bindd = $mainMod ALT, code:10, raise/lower layer 1, exec, $scriptsDir/Layers.sh raise 1
bindd = $mainMod ALT, code:11, raise/lower layer 2, exec, $scriptsDir/Layers.sh raise 2
bindd = $mainMod ALT, code:12, raise/lower layer 3, exec, $scriptsDir/Layers.sh raise 3

bindd = $mainMod ALT SHIFT, code:10, send window to layer 1, exec, $scriptsDir/Layers.sh send 1
bindd = $mainMod ALT SHIFT, code:11, send window to layer 2, exec, $scriptsDir/Layers.sh send 2
bindd = $mainMod ALT SHIFT, code:12, send window to layer 3, exec, $scriptsDir/Layers.sh send 3

bindd = $mainMod ALT, code:19, hide layer, exec, $scriptsDir/Layers.sh hide


# ── SEND A WINDOW TO THE OTHER MONITOR ──────────────────────────────────
# SUPER CTRL ALT + arrow. This is the only arrow combination left free by
# configs/Keybinds.conf, and it completes a consistent ladder:
#   SUPER            + arrow    focus
#   SUPER SHIFT      + arrow    resize
#   SUPER CTRL       + arrow    move within the layout
#   SUPER ALT        + arrow    swap with the neighbour
#   SUPER CTRL ALT   + arrow    send to the monitor in that direction
#
# The mouse does the same thing: SUPER + left-drag a window across the
# screen boundary and drop it (works for tiled and floating windows alike).
# Logic: ~/.config/hypr/scripts/MoveToMonitor.sh

bindd = $mainMod CTRL ALT, left,  send window to monitor left,  exec, $scriptsDir/MoveToMonitor.sh l
bindd = $mainMod CTRL ALT, right, send window to monitor right, exec, $scriptsDir/MoveToMonitor.sh r
bindd = $mainMod CTRL ALT, up,    send window to monitor up,    exec, $scriptsDir/MoveToMonitor.sh u
bindd = $mainMod CTRL ALT, down,  send window to monitor down,  exec, $scriptsDir/MoveToMonitor.sh d


# ── MOUSE: the whole desktop without the keyboard ───────────────────────
# Nothing here is tiled, so the desktop can be driven entirely by pointer:
# click a window to focus it, and scripts/RaiseOnFocus.sh raises it to the
# front of the stack; drag it wherever you like; pull its border to resize.
# These gestures cover the rest:
#
#   SUPER            + middle-click    close the window
#   SUPER CTRL       + middle-click    put it back into the layout / float it
#   SUPER SHIFT      + middle-click    move it onto the up plane, or back out
#   SUPER ALT        + middle-click    show the last plane / hide the one up
#   SUPER CTRL       + scroll down     next plane   (none -> 1 -> 2 -> 3 -> none)
#   SUPER CTRL       + scroll up       previous plane
#
# Together with the drags inherited from configs/Keybinds.conf:
#   SUPER + left-drag     move a window (drag it onto another, or across the
#                         screen edge to hand it to the other monitor)
#   SUPER + right-drag    resize a window
#   drag its border       resize, no modifier needed (general:resize_on_border)
#
# Close lives on a gesture on purpose: a floating desktop has no titlebars,
# so there is no close button to click, and a bare terminal offers no way
# out of itself — this keeps closing a pointer-only action.
#
# Dispatchers act on the FOCUSED window, and with input:follow_mouse = 0 that
# is the last window you clicked — so click first, then gesture. Hyprland
# cannot target "the window under the pointer": both `focuswindow mouse`
# and `togglefloating mouse` were tried and silently do nothing.
# Logic: ~/.config/hypr/scripts/Layers.sh  (toggle / toggleplane / next / prev)

bindd = $mainMod, mouse:274, close window, killactive,
bindd = $mainMod CTRL, mouse:274, tile / float again, togglefloating,
bindd = $mainMod SHIFT, mouse:274, move window into the current layer, exec, $scriptsDir/Layers.sh toggle
bindd = $mainMod ALT, mouse:274, show or hide the current layer, exec, $scriptsDir/Layers.sh toggleplane
bindd = $mainMod CTRL, mouse_down, next layer, exec, $scriptsDir/Layers.sh next
bindd = $mainMod CTRL, mouse_up, previous layer, exec, $scriptsDir/Layers.sh prev
# Unbind SUPER + S from its default action
unbind = SUPER, S

# Bind SUPER + S to the screenshot menu with a description

bindd = SUPER, S, Screenshot Interactive Region, exec, grim -g "$(slurp)" - | wl-copy && notify-send "Screenshot" "Region copied to clipboard"
