# Commands and Apps to be executed at launch

# ── Unified glass desktop ───────────────────────────────────────────────
# Bar (waybar) and notifications (swaync) already come from
# configs/Startup_Apps.conf. Only the dock has to be added here.

# Dock: bottom, auto-hiding, centred pill. Its launcher button (grid icon)
# opens the same rofi launchpad as SUPER + D — see
# ~/.config/hypr/scripts/RofiLaunchpad.sh.
# Config:   ~/.config/nwg-dock-hyprland/config.toml
# Styling:  ~/.config/nwg-dock-hyprland/style.css  ->  ~/.config/hypr/glass.css
# Blur:     UserConfigs/WindowRules.conf  (namespace nwg-dock)
exec-once = env XCURSOR_THEME=Bibata-Modern-Ice XCURSOR_SIZE=24 HYPRCURSOR_THEME=Bibata-Modern-Ice HYPRCURSOR_SIZE=24 $HOME/.cargo/bin/nwg-dock

# ── Click-to-front for overlapping windows ──────────────────────────────
# Hyprland focuses a window on click but never reorders the stack, so a
# window you click can stay buried under the one covering it. This watches
# the event socket and raises whatever gets focused, which is what makes a
# pile of floating windows behave like a normal desktop.
# Script:  ~/.config/hypr/scripts/RaiseOnFocus.sh
# Pairs with: input:follow_mouse = 0  in UserConfigs/UserSettings.conf
# The script guards against a second copy starting on config reload.
exec-once = $HOME/.config/hypr/scripts/RaiseOnFocus.sh

# ── hyprbars: a real titlebar on every window ────────────────────────────
# Undecorated windows (kitty, Electron apps, anything without a client-side
# headerbar) have nothing to grab, so a titlebar gives them the same drag
# handle that decorated windows already get from their own headerbar — and
# leaves left-drag inside the app free for selecting text.
#
# Loaded here rather than through hyprpm, which needs a root-owned state store
# under /var. The guard means a plugin that is missing (not built yet) or stale
# (refused after a Hyprland upgrade) is simply skipped instead of shouting at
# every login; BuildHyprbars.sh prints what to do about it.
#
# The loader also applies the plugin's own window rules. Those cannot live in
# WindowRules.conf: `hyprbars:no_bar` is a field the plugin registers on init,
# and Hyprland rejects an unknown rule field at parse time, which is fatal to
# the whole rule — so a config naming it errors out whenever the plugin is not
# loaded, and exec-once runs after the config is parsed in any case.
# Build:    ~/.config/hypr/scripts/BuildHyprbars.sh
# Loader:   ~/.config/hypr/scripts/LoadHyprbars.sh
# Styling:  UserConfigs/UserDecorations.conf  (plugin:hyprbars block)
# The first load was done by hand from a live session rather than from here, so
# that a plugin which crashed the compositor could not also crash every login.
# It loaded cleanly and has been running since; this is now enabled for login.
exec-once = $HOME/.config/hypr/scripts/LoadHyprbars.sh
