# Frosted fill for hyprbars' titlebars: the wallust background with alpha, so
# plugin:hyprbars bar_color re-tints with the wallpaper like the borders do.
# The cc is what makes bar_blur visible through it; an opaque bar shows none.
$glassbar = rgba(2A2331cc)

# The same treatment for the two titlebar buttons, so they stay tinted by the
# wallpaper instead of being frozen at today's hex. Derived from colours that
# are already in the palette rather than new ones, so nothing else moves.
$glassred = rgba(270B48cc)
$glassacc = rgba(9A538Ccc)
