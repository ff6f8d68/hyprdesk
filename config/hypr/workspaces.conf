# You can set workspace rules to achieve workspace-specific behaviors. 
# For instance, you can define a workspace where all windows are drawn without borders or gaps.

# https://wiki.hyprland.org/Configuring/Workspace-Rules/

# Assigning workspace to a certain monitor. Below are just examples
# workspace = 1, monitor:eDP-1
# workspace = 2, monitor:eDP-1
# workspace = 3, monitor:eDP-1
# workspace = 4, monitor:eDP-1
# workspace = 5, monitor:DP-2
# workspace = 6, monitor:DP-2
# workspace = 7, monitor:DP-2
# workspace = 8, monitor:DP-2


# example rules (from wiki)
# workspace = 3, rounding:false, decorate:false
# workspace = name:coding, rounding:false, decorate:false, gapsin:0, gapsout:0, border:false, decorate:false, monitor:DP-1
# workspace = 8,bordersize:8
# workspace = name:Hello, monitor:DP-1, default:true
# workspace = name:gaming, monitor:desc:Chimei Innolux Corporation 0x150C, default:true
# workspace = 5, on-created-empty:[float] firefox
# workspace = special:scratchpad, on-created-empty:foot


# ══════════════════════════════════════════════════════════════════════════
# MAIN SCREEN vs SECONDARY
# ══════════════════════════════════════════════════════════════════════════
# The Samsung (main screen) owns the primary workspaces and the ThinkPad panel
# owns the rest, so SUPER+1 always lands on the main screen.
#
# This is what actually makes the Samsung the main screen — monitor position
# alone does not decide it. Hyprland gives a new workspace to the monitor it
# is created on, and the built-in panel is always present at startup while the
# Samsung may not be, so with no rules workspace 1 opens back on the laptop.
#
# Unplug the Samsung and workspaces 1-5 have no monitor left; Hyprland moves
# them onto the remaining one, so the ThinkPad takes over as the main screen
# by itself. Nothing here needs to be switched by hand.
#
# Matched by connector name rather than `monitor:desc:...` deliberately — there
# is only one HDMI port, so there is nothing to disambiguate and a name is
# easier to read. Swap to `monitor:desc:Samsung Electric Company LS24AG30x` if
# it ever moves to another port and the binding should follow the panel.
workspace = 1, monitor:HDMI-A-1
workspace = 2, monitor:HDMI-A-1
workspace = 3, monitor:HDMI-A-1
workspace = 4, monitor:HDMI-A-1
workspace = 5, monitor:HDMI-A-1
workspace = 6, monitor:eDP-1
workspace = 7, monitor:eDP-1
workspace = 8, monitor:eDP-1
workspace = 9, monitor:eDP-1
workspace = 10, monitor:eDP-1